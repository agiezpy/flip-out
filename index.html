<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Flip Out!</title>
<style>
/* VOICE playful arcade, IDEA a neon gravity corridor, PICTURE the game itself full screen,
   COLOUR deep night field shifting per zone, cyan surfaces, hot pink hazards, gold orbs, TYPE heavy system sans,
   LAYOUT full-bleed canvas, corridor centred, UI above and below */
html,body{margin:0;height:100%;background:#0d0a24;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#sharebox,.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(8,5,24,.75);z-index:5;font:800 16px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff}
#sharebox.on,.ov.on{display:flex}
.ov .card{width:min(360px,calc(100vw - 28px));max-height:calc(100dvh - 28px);overflow:auto;background:#1d1640;border:2px solid #ffd23f;border-radius:24px;padding:20px 18px;text-align:center;box-sizing:border-box}
.ov h2{margin:0 0 6px;font:900 26px system-ui,sans-serif}
.ov .sub{margin:0 0 14px;color:rgba(255,255,255,.65);font-size:14px}
.nm{font:900 26px system-ui,sans-serif;color:#ffd23f;margin:8px 0 14px;min-height:34px}
.pick{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0;background:rgba(255,255,255,.07);border-radius:18px;padding:4px}
.pick span{flex:1;font:900 20px system-ui,sans-serif}
.ov button{min-height:48px;border:0;border-radius:24px;font:900 17px system-ui,sans-serif;cursor:pointer;color:#fff;background:rgba(255,255,255,.14)}
.ov button.go{background:#ffd23f;color:#2a1a00;width:100%;margin-top:12px;font-size:20px;min-height:56px}
.ov button.ar{width:52px;font-size:22px}
.ov button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.rk{list-style:none;margin:0;padding:0;text-align:left}
.rk li{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:14px;margin:4px 0;background:rgba(255,255,255,.05)}
.rk li.me{background:rgba(255,210,63,.18);outline:2px solid #ffd23f}
.rk .p{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:900 14px system-ui,sans-serif;background:rgba(255,255,255,.12);flex:none}
.rk .p1{background:#ffd23f;color:#2a1a00}.rk .p2{background:#d6dbe6;color:#1d1640}.rk .p3{background:#d88a4a;color:#2a1200}
.rk .w{width:12px;height:12px;border-radius:4px;flex:none}
.rk .n{flex:1;font:800 16px system-ui,sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .s{font:900 18px system-ui,sans-serif;font-variant-numeric:tabular-nums}
.rk .empty{justify-content:center;color:rgba(255,255,255,.6)}
.ov input{width:100%;box-sizing:border-box;min-height:52px;border-radius:16px;border:2px solid rgba(255,255,255,.25);background:#0d0a24;color:#fff;font:900 20px system-ui,sans-serif;text-align:center;padding:8px 12px;-webkit-user-select:text;user-select:text}
.ov input:focus{outline:none;border-color:#ffd23f}
.ov .err{min-height:20px;margin:6px 0 2px;color:#ff8ae0;font-size:14px}
.ov .or{margin:6px 0 2px;color:rgba(255,255,255,.5);font-size:13px}
.shake{animation:sh .35s}@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
.row2{display:flex;gap:10px;margin-top:12px}.row2 button{flex:1}
#sharebox .card{width:min(340px,calc(100vw - 32px));background:#1d1640;border:2px solid #ffd23f;border-radius:22px;padding:20px;text-align:center}
#sharebox p{margin:0 0 12px}
#sharebox textarea{width:100%;box-sizing:border-box;height:96px;border-radius:12px;border:0;padding:10px;font:600 15px system-ui,sans-serif;resize:none;background:#0d0a24;color:#fff;-webkit-user-select:text;user-select:text}
#sharebox .row{display:flex;gap:10px;margin-top:14px}
#sharebox button{flex:1;min-height:48px;border:0;border-radius:24px;font:900 17px system-ui,sans-serif;cursor:pointer}
#sharebox #cp{background:#ffd23f;color:#2a1a00}#sharebox #cl{background:rgba(255,255,255,.14);color:#fff}
#sharebox button:focus-visible{outline:3px solid #fff;outline-offset:2px}
canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="namebox" class="ov" role="dialog" aria-label="Pick your name"><div class="card"><h2>Pick your name!</h2><p class="sub">Use a nickname, not your real name</p>
<input id="nmIn" maxlength="14" placeholder="Type your nickname" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="Your nickname">
<p class="err" id="nmErr" role="status"></p>
<p class="or">or build one</p>
<div class="nm" id="nmShow"></div>
<div class="pick"><button class="ar" id="a1l" aria-label="Previous word">&#9664;</button><span id="a1"></span><button class="ar" id="a1r" aria-label="Next word">&#9654;</button></div>
<div class="pick"><button class="ar" id="a2l" aria-label="Previous animal">&#9664;</button><span id="a2"></span><button class="ar" id="a2r" aria-label="Next animal">&#9654;</button></div>
<div class="row2"><button id="nmRnd">Surprise me</button></div>
<button class="go" id="nmOk">OK!</button></div></div>
<div id="rankbox" class="ov" role="dialog" aria-label="Ranking"><div class="card"><h2>Top 10</h2><p class="sub">Best runs on this device</p><ol class="rk" id="rkList"></ol>
<div class="row2"><button id="rkName">Change name</button><button id="rkClose">Close</button></div></div></div>
<div id="sharebox" role="dialog" aria-label="Challenge a friend"><div class="card"><p>Send this to a friend</p><textarea id="sharetxt" readonly></textarea><div class="row"><button id="cp">Copy</button><button id="cl">Close</button></div></div></div>
<script>
{
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const H=300,S=30,PX=90,G=3000,KICK=260,SPH=28,HZ='#ff2e63',GOLD='#ffd23f',OK='#5dff9d';
const FONT='system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
let W=0,Hs=0,DPR=1,sc=1,offY=0,viewW=460;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;Hs=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(Hs*DPR);sc=Math.min(W/460,Hs/620);viewW=W/sc;offY=(Hs/sc-H)/2;}
addEventListener('resize',resize);resize();

const FLIGHT=(()=>{let y=0,v=KICK,tt=0;while(y<H-S){v+=G/240;y+=v/240;tt+=1/240}return tt})();
const store={get(k,d){try{const v=localStorage.getItem('flipout_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('flipout_'+k,JSON.stringify(v))}catch(e){}}};
let best=store.get('best',0),total=store.get('total',0),skin=store.get('skin',0),runs=store.get('runs',0),muted=store.get('muted',false);
let worldIdx=store.get('world',0)%6,disc=store.get('disc',[]),pendingWorld=0,learned=store.get('learned',false),tutorial=false,ach=store.get('ach',{}),bestZone=store.get('bestZone',0),missions=store.get('missions',null),mdone=store.get('mdone',0);
function save(){store.set('best',best);store.set('total',total);store.set('skin',skin);store.set('runs',runs);store.set('muted',muted);store.set('ach',ach);store.set('bestZone',bestZone);store.set('missions',missions);store.set('mdone',mdone);store.set('learned',learned);store.set('world',pendingWorld);store.set('disc',disc);store.set('name',pname);store.set('hof',hof);store.set('askedName',askedName)}

/* ---------- zones ---------- */
const ZONES=[
 {n:'WARM UP',s:0,h:250,nw:'spikes'},
 {n:'BLOCK PARTY',s:75,h:290,nw:'tall blocks'},
 {n:'SAW FACTORY',s:175,h:330,nw:'moving saws'},
 {n:'DOUBLE TROUBLE',s:300,h:375,nw:'double saws'},
 {n:'CHAOS CORE',s:450,h:425,nw:'top speed'},
 {n:'HYPERSPACE',s:650,h:500,nw:'endless'}];
const WORLDS=[
 {n:'NEON CITY',h:250,s:60,l:[9,17],sil:'city',wx:'stars',surf:null},
 {n:'FROZEN PEAKS',h:212,s:45,l:[11,22],sil:'mount',wx:'snow',surf:'#c8f4ff'},
 {n:'DEEP SEA',h:198,s:75,l:[8,20],sil:'sea',wx:'bubbles',surf:'#3dffd8'},
 {n:'WILD JUNGLE',h:138,s:50,l:[7,16],sil:'jungle',wx:'fireflies',surf:'#a6ff4d'},
 {n:'LAVA LAND',h:8,s:65,l:[7,15],sil:'volcano',wx:'embers',surf:'#ffb23d'},
 {n:'THUNDER STORM',h:225,s:28,l:[8,16],sil:'city',wx:'rain',surf:'#8ab8ff'}];
const zoneAt=s=>{let z=0;for(let i=0;i<ZONES.length;i++)if(s>=ZONES[i].s)z=i;return z};
const ZSPEED=[300,325,360,400,450,500];

/* ---------- skins ---------- */
const SKINS=[{n:'Zap',c:'#33e1ff',cost:0},{n:'Lemon',c:'#ffe14d',cost:25},{n:'Bubblegum',c:'#ff8ae0',cost:60},{n:'Lime',c:'#7dff6b',cost:120},{n:'Lava',c:'#ff8a3d',cost:200},{n:'Ghost',c:'#f4f4ff',cost:320},{n:'Rainbow',c:'rainbow',cost:500},
 {n:'Blaze',c:'#ff4a1c',ach:'combo5',d:'Hit a x5 combo'},{n:'King',c:'#ffcc33',ach:'score500',d:'Score 500',crown:1},{n:'Void',c:'#9b5cff',ach:'zone5',d:'Reach HYPERSPACE'}];
const unlocked=i=>{const s=SKINS[i];return s.ach?!!ach[s.ach]:s.cost<=total};
if(!SKINS[skin]||!unlocked(skin))skin=0;
let t=0,gt=0;
const skinCol=i=>{const s=SKINS[i];return s.c==='rainbow'?`hsl(${(t*160)%360},100%,65%)`:s.c};

/* ---------- missions ---------- */
const MT={
 orbs:{d:n=>`Collect ${n} orbs in one run`,w:()=>'ORBS',n:L=>Math.min(60,10+5*L),run:1},
 close:{d:n=>`Get ${n} CLOSE! in one run`,w:()=>'CLOSE!',n:L=>Math.min(10,2+L),run:1},
 score:{d:n=>`Score ${n} points`,w:()=>'POINTS',n:L=>Math.min(800,60+40*L),run:1},
 zone:{d:n=>`Reach ${ZONES[n].n}`,w:n=>`ZONE ${n+1}`,n:()=>Math.min(5,bestZone+1),run:1},
 flips:{d:n=>`Flip ${n} times in one run`,w:()=>'FLIPS',n:L=>Math.min(150,20+10*L),run:1},
 combo:{d:n=>`Hit a x${n} combo`,w:()=>'COMBO',n:L=>Math.min(5,2+Math.floor(L/3)),run:1},
 runs:{d:n=>`Play ${n} runs`,w:()=>'PLAYS',n:L=>Math.min(10,3+L)},
 totalorbs:{d:n=>`Collect ${n} orbs in total`,w:()=>'ALL ORBS',n:L=>Math.min(300,40+20*L)}};
function newMission(ex){let keys=Object.keys(MT).filter(k=>!ex.includes(k));if(bestZone>=5)keys=keys.filter(k=>k!=='zone');const k=keys[Math.floor(Math.random()*keys.length)];return{k,n:MT[k].n(mdone),p:0,done:false,rw:Math.min(50,10+5*mdone)}}
function fillMissions(){if(!Array.isArray(missions))missions=[];missions=missions.filter(m=>m&&MT[m.k]&&!m.done);while(missions.length<3)missions.push(newMission(missions.map(m=>m.k)))}
fillMissions();
let R={orbs:0,close:0,flips:0,combo:1,zone:0};
const mval=m=>MT[m.k].run?(m.k==='score'?score:R[m.k]):m.p;
const mdisp=m=>m.k==='zone'?[Math.min(score,ZONES[m.n].s),ZONES[m.n].s]:[Math.min(m.n,mval(m)),m.n];

let state='menu',paused=false,camX=0,bgX=0,speed=300,dist=0,score=0,bonus=0,orbsRun=0,bump=0,zi=0;
let P={y:H-S,vy:0,g:1,fy:1,squash:0,lastFlip:-9,ground:true,blink:0};
let obs=[],orbs=[],parts=[],pops=[],trail=[],banners=[],runSkins=[];
let nextX=0,tutLeft=0,tutSide='c',combo=1,comboT=0,orbStreak=0,orbT=0,shake=0,flash=0,deadT=0,menuT=0,hint=false;
let newBest=false,hue=250,toast='',toastT=0,zoneBanner=0,runStartTotal=0,doneThisRun=[];
const UI={};
const ADJ=['Super','Turbo','Mega','Happy','Brave','Cosmic','Ninja','Lucky','Swift','Mighty','Funky','Rocket','Jolly','Sneaky','Epic','Fluffy','Zippy','Bouncy','Sparky','Wild'];
const ANI=['Panda','Tiger','Fox','Shark','Comet','Dragon','Koala','Otter','Penguin','Falcon','Llama','Robot','Bunny','Wolf','Gecko','Moose','Octopus','Yeti','Hamster','Dino'];
let pname=store.get('name',''),hof=store.get('hof',[]),lastEntry=null,lastRank=0,askedName=store.get('askedName',false);
if(!Array.isArray(hof))hof=[];
let na=Math.floor(Math.random()*ADJ.length),nb=Math.floor(Math.random()*ANI.length),nnum=10+Math.floor(Math.random()*90);
{const m=/^(\w+) (\w+) (\d+)$/.exec(pname);if(m&&ADJ.includes(m[1])&&ANI.includes(m[2])){na=ADJ.indexOf(m[1]);nb=ANI.indexOf(m[2]);nnum=+m[3]}}
const BAD=['fuck','shit','bitch','cunt','pussy','whore','slut','nigg','fagg','retard','porn','dick','cock','penis','vagin','nazi','hitler','kill','puta','puto','mierd','pendej','verga','pija','cabron','maric','culiao','culero','chinga','joder','polla','gilipoll','zorra','idiot','estupid','imbecil','caralh','porra','buceta','foda','tonto','tonta','bobo','boba','pelotud','boludo','forro','tarad','mogol','sexo','sexy','violar','matar'];
const BADW=['ass','fea','feo','gordo','gorda','culo','teta','tetas','pene','rape','sex','gay','loser','ugly','stupid','dumb'];
function cleanName(raw){if(/@|https?:|www\.|\.com/i.test(String(raw||'')))return{ok:false,msg:'No emails or links, please!'};let n=String(raw||'').normalize('NFC').replace(/[^\p{L}\p{N} ]/gu,'').replace(/\s+/g,' ').trim().slice(0,14);
  if(!n)return{ok:false,msg:''};
  if(n.replace(/ /g,'').length<2)return{ok:false,msg:'A bit longer, please!'};
  if(/\d{5,}/.test(n))return{ok:false,msg:'No phone numbers, please!'};
  const norm=t=>t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/0/g,'o').replace(/1/g,'i').replace(/3/g,'e').replace(/4/g,'a').replace(/5/g,'s').replace(/7/g,'t').replace(/(.)\1+/g,'$1');
  const flat=norm(n).replace(/[^a-z]/g,''),words=norm(n).split(' ').map(w=>w.replace(/[^a-z]/g,''));
  if(BAD.some(b=>flat.includes(norm(b)))||words.some(w=>BADW.map(norm).includes(w)))return{ok:false,msg:'Try a friendlier name!'};
  return{ok:true,name:n}}
const nameNow=()=>`${ADJ[na]} ${ANI[nb]} ${nnum}`;
const $=id=>document.getElementById(id);
const anyOverlay=()=>!!document.querySelector('.ov.on,#sharebox.on');
function showName(){$('a1').textContent=ADJ[na];$('a2').textContent=ANI[nb];$('nmShow').textContent=nameNow()}
function nameErr(m){const e=$('nmErr');e.textContent=m;const c=$('namebox').querySelector('.card');c.classList.remove('shake');void c.offsetWidth;if(m)c.classList.add('shake')}
function openName(){showName();const typed=pname&&!/^\w+ \w+ \d+$/.test(pname);$('nmIn').value=typed?pname:'';nameErr('');$('namebox').classList.add('on');setTimeout(()=>{try{$('nmOk').focus()}catch(e){}},30)}
function cyc(which,d){$('nmIn').value='';nameErr('');if(which===1)na=(na+d+ADJ.length)%ADJ.length;else nb=(nb+d+ANI.length)%ANI.length;showName();tone(700,900,.05,'triangle',.05)}
function rkRender(){const el=$('rkList');const w=WORLDS;
  el.innerHTML=hof.length?hof.map((e,i)=>`<li class="${e===lastEntry?'me':''}"><span class="p ${i<3?'p'+(i+1):''}">${i+1}</span><span class="w" style="background:hsl(${(w[e.w]||w[0]).h},60%,55%)"></span><span class="n"></span><span class="s">${Math.floor(+e.s)||0}</span></li>`).join(''):'<li class="empty">Play a run to get on the board!</li>';
  if(hof.length)[...el.querySelectorAll('.n')].forEach((n,i)=>n.textContent=String(hof[i].n||'Player').slice(0,24))}
function openRank(){rkRender();$('rankbox').classList.add('on')}
let wx=[],jel=[],bolt=0,boltT=4;
function newP(anyY){const k=WORLDS[worldIdx].wx,y0=rnd(-offY,H+offY);
  if(k==='snow')return{x:rnd(0,viewW),y:anyY?y0:-offY-5,vy:rnd(25,70),r:rnd(1,3),ph:rnd(0,6)};
  if(k==='rain')return{x:rnd(0,viewW+200),y:anyY?y0:-offY-20,vy:rnd(650,900),r:rnd(10,18)};
  if(k==='bubbles')return{x:rnd(0,viewW),y:anyY?y0:H+offY+5,vy:-rnd(30,90),r:rnd(1.5,5),ph:rnd(0,6)};
  if(k==='embers')return{x:rnd(0,viewW),y:anyY?y0:H+offY+5,vy:-rnd(40,130),r:rnd(1,3),ph:rnd(0,6)};
  if(k==='fireflies')return{x:rnd(0,viewW),y:y0,vy:0,r:rnd(1.5,3),ph:rnd(0,6),leaf:Math.random()<.35};
  return{x:0,y:0,vy:0,r:0,ph:0}}
function initWeather(){wx=[];jel=[];const k=WORLDS[worldIdx].wx,n={snow:90,rain:100,bubbles:45,embers:60,fireflies:36}[k]||0;
  for(let i=0;i<n;i++)wx.push(newP(true));
  if(k==='bubbles')for(let i=0;i<5;i++)jel.push({x:rnd(0,viewW),y:i%2?rnd(-offY*.8,-30):rnd(H+30,H+offY*.8),ph:rnd(0,6),s:rnd(12,22)})}
function updWeather(dt,mv){const k=WORLDS[worldIdx].wx;
  for(let i=0;i<wx.length;i++){const p=wx[i];p.x-=mv*dt*(k==='rain'?.5:.25);
    if(k==='snow'){p.y+=p.vy*dt;p.x+=Math.sin(t*1.5+p.ph)*20*dt;if(p.y>H+offY+5)wx[i]=newP(false)}
    else if(k==='rain'){p.y+=p.vy*dt;p.x-=p.vy*.18*dt;if(p.y>H+offY)wx[i]=newP(false)}
    else if(k==='bubbles'||k==='embers'){p.y+=p.vy*dt;p.x+=Math.sin(t*2+p.ph)*15*dt;if(p.y<-offY-5)wx[i]=newP(false)}
    else if(k==='fireflies'){if(p.leaf){p.y+=35*dt;p.x+=Math.sin(t+p.ph)*30*dt;if(p.y>H+offY+5){p.y=-offY-5;p.x=rnd(0,viewW)}}else{p.x+=Math.cos(t*.7+p.ph)*20*dt;p.y+=Math.sin(t*.9+p.ph*2)*20*dt}}
    const q=wx[i];if(q.x<-20)q.x+=viewW+40;else if(q.x>viewW+220)q.x-=viewW+40}
  for(const j of jel){j.x-=mv*dt*.12;j.y+=Math.sin(t*.8+j.ph)*8*dt;if(j.x<-40)j.x+=viewW+80}
  if(k==='rain'){boltT-=dt;if(boltT<0){bolt=1;boltT=rnd(4,9);noise(.7,.07)}bolt=Math.max(0,bolt-dt*3)}else bolt=0}
const SHARE_URL='https://claude.ai/artifact/JpjECgAixZ3aiUudiBBiWT';
let challenge=0,chBeaten=false,shareDown=false;
function readHash(){const m=/^#beat(\d{1,5})$/.exec(location.hash||'');challenge=m?+m[1]:0;chBeaten=false}
readHash();addEventListener('hashchange',readHash);

/* ---------- audio ---------- */
let AC=null;
function au(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume().catch(()=>{})}
function tone(f1,f2,dur,type,vol,delay){if(muted||!AC)return;try{const n=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f1,n);o.frequency.exponentialRampToValueAtTime(f2,n+dur);g.gain.setValueAtTime(vol||.12,n);g.gain.exponentialRampToValueAtTime(.001,n+dur);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+dur+.02)}catch(e){}}
function noise(dur,vol){if(muted||!AC)return;try{const n=AC.currentTime,len=Math.floor(AC.sampleRate*dur),b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);const s=AC.createBufferSource(),g=AC.createGain();s.buffer=b;g.gain.value=vol;s.connect(g);g.connect(AC.destination);s.start(n)}catch(e){}}
const fanfare=()=>{[523,659,784,1047].forEach((f,i)=>tone(f,f*1.01,.18,'triangle',.08,i*.08))};
const vib=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};

/* ---------- helpers ---------- */
const rnd=(a,b)=>a+Math.random()*(b-a);
const hh=(i,s)=>{const x=Math.sin(i*127.1+s*311.7)*43758.5453;return x-Math.floor(x)};
function pick(ws){let s=0;for(const w of ws)s+=Math.max(0,w);let r=Math.random()*s;for(let i=0;i<ws.length;i++){r-=Math.max(0,ws[i]);if(r<=0)return i}return 0}
const rr=(ax,ay,as,bx,by,bw,bh)=>ax<bx+bw&&ax+as>bx&&ay<by+bh&&ay+as>by;
const diff=()=>Math.min(1,score/500);
function burst(x,y,c,n,pw){for(let i=0;i<n;i++){const a=Math.random()*6.283,v=Math.random()*pw;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(.4,1),max:1,c,s:rnd(3,7)})}}
function pop(txt,c,big){pops.push({x:camX+PX+S/2,y:P.y+(P.g>0?-14:S+26),txt,c,life:1,big})}
function banner(o){o.life=2.4;banners.push(o)}
function unlockAch(key){if(ach[key])return;ach[key]=1;const i=SKINS.findIndex(s=>s.ach===key);if(i>=0){runSkins.push(i);banner({si:i});fanfare()}}

/* ---------- level generation ---------- */
function strip(x,side,len,hintFlag,withOrbs){obs.push({t:'sp',x,w:len,side,hint:hintFlag});if(withOrbs){const n=Math.floor(len/42);for(let i=0;i<n;i++)orbs.push({x:x+21+i*42,y:side==='f'?S/2:H-S/2})}}
function gen(){
  const limit=camX+viewW+300;
  while(nextX<limit){
    const d=diff(),z=zi,sp=Math.max(speed,300),fl=sp*FLIGHT;
    const after=()=>fl+S+80+Math.random()*(150*(1-d)+50);
    let x=nextX;
    if(tutLeft>0){strip(x,tutSide,150,true,true);tutSide=tutSide==='f'?'c':'f';tutLeft--;nextX=x+150+fl+S+260;continue}
    const k=pick([30,14+30*d,14,z>=2?14+16*d:0,z>=1?10:0,18-10*d]);
    if(k===0){const side=Math.random()<.5?'f':'c',len=rnd(60,110+150*d);strip(x,side,len,false,Math.random()<.6);nextX=x+len+after()}
    else if(k===1){let side=Math.random()<.5?'f':'c';const n=2+Math.floor(Math.random()*(1+3*d));
      for(let i=0;i<n;i++){if(z>=1&&Math.random()<0.4){const w=rnd(28,46),h=rnd(80,H*0.45);obs.push({t:'bl',x,w,h,side});x+=w}else{const len=rnd(45,90);strip(x,side,len,false,false);x+=len}
        side=side==='f'?'c':'f';if(i<n-1)x+=fl+S+40+Math.random()*70*(1-d)}
      nextX=x+after()}
    else if(k===2){const r=rnd(24,30+10*d),cnt=z>=3&&Math.random()<.55?2:1;for(let i=0;i<cnt;i++)obs.push({t:'sw',x:x+r+i*(r*2+50),y0:H/2,r,amp:0,om:0,ph:0});
      const span=cnt*(r*2)+(cnt-1)*50,side=Math.random()<.5?'f':'c';for(let i=0;i*36<span;i++)orbs.push({x:x+i*36+10,y:side==='f'?H-S/2:S/2});nextX=x+span+after()}
    else if(k===3){const r=26;obs.push({t:'sw',x:x+r,y0:H/2,r,amp:H/2-r-3,om:rnd(2.2,3.2+1.5*d),ph:rnd(0,6.28)});nextX=x+r*2+after()}
    else if(k===4){const side=Math.random()<.5?'f':'c',r=rnd(30,40);obs.push({t:'sw',x:x+r,y0:side==='f'?H-4:4,r,amp:0,om:0,ph:0});nextX=x+r*2+after()}
    else{let down=Math.random()<.5;for(let s2=0;s2<2;s2++){for(let i=0;i<=6;i++){const tt=FLIGHT*i/6,yy=Math.min(H-S,KICK*tt+.5*G*tt*tt)+S/2;orbs.push({x:x+sp*tt+S/2,y:down?yy:H-yy})}x+=fl+90;down=!down}nextX=x+after()}
  }
}

/* ---------- game flow ---------- */
function flip(){P.g*=-1;P.vy=P.g*KICK;P.lastFlip=gt;P.ground=false;if(state==='play')R.flips++;tone(P.g>0?520:260,P.g>0?260:520,.11,'square',.05);
  for(let i=0;i<6;i++)parts.push({x:camX+PX+S/2+rnd(-12,12),y:P.g>0?2:H-2,vx:rnd(-120,-40),vy:P.g>0?rnd(20,90):rnd(-90,-20),life:.35,max:.35,c:'#fff',s:3})}
function start(){fillMissions();state='play';paused=false;camX=0;dist=0;score=0;bonus=0;orbsRun=0;speed=300;gt=0;zi=0;obs=[];orbs=[];pops=[];trail=[];banners=[];runSkins=[];doneThisRun=[];
  combo=1;comboT=0;orbStreak=0;newBest=false;zoneBanner=0;runStartTotal=total;chBeaten=false;R={orbs:0,close:0,flips:0,combo:1,zone:0};
  if(!disc.includes(worldIdx))disc.push(worldIdx);pendingWorld=(worldIdx+1)%WORLDS.length;banner({w:worldIdx});
  P.lastFlip=-9;nextX=PX+640;tutorial=!learned;tutLeft=tutorial?2:0;flip();tutSide=P.g>0?'f':'c';gen()}
function restart(){worldIdx=pendingWorld;hue=WORLDS[worldIdx].h;initWeather();P={y:H-S,vy:0,g:1,fy:1,squash:0,lastFlip:-9,ground:true,blink:0};start()}
function checkMissions(){for(const m of missions){if(m.done)continue;if(mval(m)>=m.n){m.done=true;mdone++;total+=m.rw;doneThisRun.push(m);banner({m});fanfare();vib(30)}}}
function die(){state='dead';deadT=0;shake=16;flash=1;vib(90);noise(.35,.25);tone(220,40,.5,'sawtooth',.12);
  burst(camX+PX+S/2,P.y+S/2,skinCol(skin),44,460);runs++;newBest=score>best&&score>0;if(newBest)best=score;
  total+=orbsRun;for(const m of missions)if(!m.done&&m.k==='runs')m.p++;checkMissions();
  if(zi>bestZone)bestZone=zi;
  for(let i=0;i<SKINS.length;i++){const s=SKINS[i];if(!s.ach&&s.cost>runStartTotal&&s.cost<=total)runSkins.push(i)}
  if(runSkins.length)skin=runSkins[runSkins.length-1];banners=[];
  lastEntry=null;lastRank=0;if(score>0){lastEntry={n:pname||'You',s:score,w:worldIdx,d:Date.now()};hof.push(lastEntry);hof.sort((a,b)=>b.s-a.s);hof=hof.slice(0,10);lastRank=hof.indexOf(lastEntry)+1}
  save()}
function near(){combo=Math.min(5,combo+1);comboT=2.6;bonus+=5*combo;bump=1;R.close++;R.combo=Math.max(R.combo,combo);if(combo>=5)unlockAch('combo5');
  pop(combo>1?`CLOSE! x${combo}`:'CLOSE!','#fff',true);tone(1200,1900,.1,'triangle',.08);vib(15)}
function cycleSkin(dir){const un=SKINS.map((s,i)=>i).filter(unlocked);let j=un.indexOf(skin);j=(j+dir+un.length)%un.length;skin=un[j];save();tone(700,900,.06,'triangle',.06)}
const box=document.getElementById('sharebox'),ta=document.getElementById('sharetxt');

/* ---------- input ---------- */
const inR=(r,x,y)=>r&&x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h;
function press(x,y){au();
  if(x!=null&&inR(UI.mute,x,y)){muted=!muted;save();return}
  if(paused){paused=false;return}
  if(state==='menu'&&x!=null&&inR(UI.nameBtn,x,y)){openName();return}
  if(state==='menu'){if(x!=null&&inR(UI.left,x,y)){cycleSkin(-1);return}if(x!=null&&inR(UI.right,x,y)){cycleSkin(1);return}start();return}
  if(state==='play'){flip();return}
  if(state==='dead'){if(deadT<.8)return;if(x!=null&&inR(UI.share,x,y)){shareDown=true;return}if(x!=null&&inR(UI.rank,x,y)){openRank();return}restart()}}
cv.addEventListener('pointerdown',e=>{e.preventDefault();press(e.clientX,e.clientY)},{passive:false});

document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')paused=true});

/* ---------- update ---------- */
function physics(dt){const wasG=P.ground;P.vy+=G*P.g*dt;P.y+=P.vy*dt;
  if(P.g>0&&P.y>=H-S){P.y=H-S;P.vy=0;P.ground=true}else if(P.g<0&&P.y<=0){P.y=0;P.vy=0;P.ground=true}else P.ground=false;
  if(P.ground&&!wasG){P.squash=1;if(state==='play')tone(160,90,.05,'sine',.05)}}
function trailPush(){trail.push({x:camX+PX,y:P.y});if(trail.length>9)trail.shift()}
function update(rdt){
  t+=rdt;P.squash=Math.max(0,P.squash-rdt*5);P.fy+=(P.g-P.fy)*Math.min(1,rdt*20);P.blink-=rdt;if(P.blink<-3.2)P.blink=.12;
  shake=Math.max(0,shake-rdt*40);flash=Math.max(0,flash-rdt*3);bump=Math.max(0,bump-rdt*4);toastT-=rdt;zoneBanner=Math.max(0,zoneBanner-rdt);
  for(const p of parts){p.x+=p.vx*rdt;p.y+=p.vy*rdt;p.vy+=600*rdt;p.vx*=.98;p.life-=rdt}parts=parts.filter(p=>p.life>0);
  for(const p of pops)p.life-=rdt*1.2;pops=pops.filter(p=>p.life>0);
  if(banners.length){banners[0].life-=rdt;if(banners[0].life<=0)banners.shift()}
  updWeather(rdt,state==='menu'?180:state==='play'&&!paused?speed:0);
  if(state==='menu'){menuT+=rdt;bgX+=180*rdt;camX+=180*rdt;if(menuT>1){menuT=0;P.g*=-1;P.vy=P.g*KICK}physics(rdt);trailPush();return}
  if(state==='dead'){deadT+=rdt;if(!askedName&&deadT>1.1&&!anyOverlay()){askedName=true;save();openName()}return}
  if(paused)return;
  let dt=rdt;hint=false;
  if(tutorial){const px=camX+PX;for(const o of obs){if(o.hint&&!learned&&o.x+o.w<px){learned=true;save()}if(o.hint&&o.x+o.w>px){const side=P.g>0?'f':'c',dx=o.x-(px+S);if(!learned&&P.ground&&side===o.side&&dx<speed*.9&&dx>-5)hint=true;break}}}
  if(hint)dt*=.22;
  gt+=dt;
  let tgt=ZSPEED[zi]+(zi===5?Math.min(80,(score-650)/8):0);speed+=(tgt-speed)*Math.min(1,dt*1.5);
  camX+=speed*dt;dist+=speed*dt;bgX+=speed*dt;
  physics(dt);gen();trailPush();
  const px=camX+PX,hx=px+5,hy=P.y+5,hs=S-10,side=P.g>0?'f':'c';
  for(const o of obs){
    if(o.t==='sp'){const ry=o.side==='f'?H-SPH*.6:0;if(rr(hx,hy,hs,o.x+5,ry,o.w-10,SPH*.6))return die();
      if(!o.chk&&o.x<px+S){o.chk=1;if(gt-P.lastFlip<.2&&side!==o.side)near()}}
    else if(o.t==='bl'){const ry=o.side==='f'?H-o.h:0;if(rr(hx,hy,hs,o.x,ry,o.w,o.h))return die();
      if(!o.chk&&o.x<px+S){o.chk=1;if(gt-P.lastFlip<.2&&side!==o.side)near()}}
    else{const cy=o.y0+o.amp*Math.sin(gt*o.om+o.ph);const qx=Math.max(hx,Math.min(o.x,hx+hs)),qy=Math.max(hy,Math.min(cy,hy+hs));const dd=Math.hypot(o.x-qx,cy-qy)-o.r*.8;
      if(dd<0)return die();if(Math.abs(o.x-(px+S/2))<o.r+S/2)o.mc=Math.min(o.mc==null?99:o.mc,dd);
      if(!o.chk&&o.x+o.r<px){o.chk=1;if(o.mc!=null&&o.mc<16)near()}}
  }
  orbT-=dt;if(orbT<0)orbStreak=0;
  for(const b of orbs){if(!b.got&&Math.abs(b.x-(px+S/2))<22&&Math.abs(b.y-(P.y+S/2))<24){b.got=1;orbsRun++;R.orbs++;bonus+=2;orbStreak=Math.min(14,orbStreak+1);orbT=.6;
    for(const m of missions)if(!m.done&&m.k==='totalorbs')m.p++;
    tone(880*Math.pow(2,orbStreak/12),1320*Math.pow(2,orbStreak/12),.09,'triangle',.07);burst(b.x,b.y,GOLD,7,160)}}
  obs=obs.filter(o=>(o.t==='sw'?o.x+o.r:o.x+o.w)>camX-80);orbs=orbs.filter(b=>!b.got&&b.x>camX-40);
  comboT-=dt;if(comboT<=0)combo=1;
  const ns=Math.floor(dist/35)+bonus;
  if(Math.floor(ns/100)>Math.floor(score/100)&&ns>0){pop(`${Math.floor(ns/100)*100}!`,GOLD,true);tone(660,1320,.25,'triangle',.08)}
  score=ns;
  const nz=zoneAt(score);if(nz>zi){zi=nz;R.zone=zi;zoneBanner=2.6;flash=.6;fanfare();vib(40);if(zi>=5)unlockAch('zone5')}
  if(score>=500)unlockAch('score500');
  if(challenge&&!chBeaten&&score>challenge){chBeaten=true;banner({beat:1});fanfare();vib([40,40,80]);burst(camX+PX+S/2,P.y+S/2,GOLD,30,380)}
  checkMissions();
}

/* ---------- drawing ---------- */
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
/* scenery: every world mirrored top and bottom, because gravity flips */
function scenery(f,col,hmin,hmax,seed,type,near){const base=H+offY,top=-offY,ox=bgX*f;ctx.fillStyle=col;ctx.strokeStyle=col;
  const each=(bw,fn)=>{const i0=Math.floor(ox/bw);for(let i=i0-2;i<=i0+Math.ceil(viewW/bw)+2;i++)fn(i,i*bw-ox,hmin+hh(i,seed)*(hmax-hmin))};
  if(type==='city')each(48,(i,x,h)=>{const w=48*(.55+hh(i,seed+1)*.45);ctx.fillRect(x,base-h,w,h+2);ctx.fillRect(x,top-2,w,h+2);
    if(near&&hh(i,seed+5)>.5){ctx.fillStyle='rgba(255,220,120,.18)';for(let wy=12;wy<h-10;wy+=16)for(let wx2=6;wx2<w-8;wx2+=12)if(hh(i*31+wy+wx2,seed)>.55){ctx.fillRect(x+wx2,base-h+wy,5,7);ctx.fillRect(x+wx2,top+h-wy-7,5,7)}ctx.fillStyle=col}});
  else if(type==='mount')each(near?110:170,(i,x,h)=>{const bw=near?110:170,w=bw*1.7,cx=x+bw/2;for(const m of [1,-1]){const by=m>0?base:top;ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(cx-w/2,by);ctx.lineTo(cx,by-m*h);ctx.lineTo(cx+w/2,by);ctx.fill();
    if(!near){ctx.fillStyle='rgba(235,248,255,.6)';const c=.22;ctx.beginPath();ctx.moveTo(cx-w/2*c,by-m*h*(1-c));ctx.lineTo(cx,by-m*h);ctx.lineTo(cx+w/2*c,by-m*h*(1-c));ctx.lineTo(cx+w*.04,by-m*h*(1-c*.7));ctx.lineTo(cx-w*.05,by-m*h*(1-c*1.1));ctx.fill()}}});
  else if(type==='sea'){if(!near)each(95,(i,x,h)=>{for(const m of [1,-1]){ctx.beginPath();ctx.ellipse(x+47,m>0?base:top,55,h*.7,0,0,6.283);ctx.fill()}});
    else{ctx.lineWidth=6;ctx.lineCap='round';each(26,(i,x,h)=>{if(hh(i,seed+3)<.35)return;for(const m of [1,-1]){const by=m>0?base:top,sw=Math.sin(t*1.5+i)*12;ctx.beginPath();ctx.moveTo(x,by);ctx.quadraticCurveTo(x+sw,by-m*h*.5,x+sw*1.6,by-m*h);ctx.stroke()}})}}
  else if(type==='jungle'){if(!near)each(64,(i,x,h)=>{for(const m of [1,-1]){const by=m>0?base:top;ctx.beginPath();ctx.arc(x+32,by-m*h*.45,h*.55,0,6.283);ctx.fill();ctx.fillRect(x+10,m>0?by-h*.45:by,44,h*.45)}});
    else each(34,(i,x,h)=>{if(hh(i,seed+3)<.3)return;const sw=Math.sin(t*1.2+i)*5;ctx.lineWidth=2.5;for(const m of [1,-1]){const by=m>0?base:top,len=h*1.1;ctx.beginPath();ctx.moveTo(x,by);ctx.quadraticCurveTo(x+sw,by-m*len*.5,x+sw*2,by-m*len);ctx.stroke();
      for(let k=1;k<5;k++){const ly=by-m*len*k/5;ctx.beginPath();ctx.ellipse(x+sw*2*k/5+(k%2?6:-6),ly,7,3,k%2?.5:-.5,0,6.283);ctx.fill()}}})}
  else if(type==='volcano'){if(!near)each(300,(i,x,h)=>{const w=340,cx=x+150,hv=h*.95;for(const m of [1,-1]){const by=m>0?base:top;ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(cx-w/2,by);ctx.lineTo(cx-w*.1,by-m*hv);ctx.lineTo(cx+w*.1,by-m*hv);ctx.lineTo(cx+w/2,by);ctx.fill();
      ctx.fillStyle=`rgba(255,${120+Math.sin(t*3+i)*40|0},40,.75)`;ctx.beginPath();ctx.ellipse(cx,by-m*hv,w*.1,5,0,0,6.283);ctx.fill();ctx.beginPath();ctx.moveTo(cx-4,by-m*hv);ctx.lineTo(cx+4,by-m*hv);ctx.lineTo(cx+12+Math.sin(i)*6,by-m*hv*.45);ctx.lineTo(cx+8+Math.sin(i)*6,by-m*hv*.45);ctx.fill()}});
    else each(44,(i,x,h)=>{for(const m of [1,-1]){const by=m>0?base:top;ctx.beginPath();ctx.moveTo(x,by);ctx.lineTo(x+22,by-m*h*.7);ctx.lineTo(x+30,by-m*h*.4);ctx.lineTo(x+44,by);ctx.fill()}})}}
/* ---------- themed hazards: different creature per world, same pink danger glow ---------- */
let FL=1;
function angry(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(1,FL);ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-s,0,s*.85,0,6.283);ctx.arc(s,0,s*.85,0,6.283);ctx.fill();
  ctx.fillStyle='#1a0a12';ctx.beginPath();ctx.arc(-s*1.25,s*.15,s*.42,0,6.283);ctx.arc(s*.75,s*.15,s*.42,0,6.283);ctx.fill();
  ctx.strokeStyle='#1a0a12';ctx.lineWidth=Math.max(1.4,s*.4);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-s*1.9,-s*1.2);ctx.lineTo(-s*.35,-s*.55);ctx.moveTo(s*1.9,-s*1.2);ctx.lineTo(s*.35,-s*.55);ctx.stroke();ctx.restore()}
function drawHaz(o,x){ctx.save();ctx.shadowColor=HZ;ctx.shadowBlur=12;
  if(o.t==='sw'){const cy=o.y0+o.amp*Math.sin(gt*o.om+o.ph);
    if(o.amp){ctx.save();ctx.shadowBlur=0;ctx.strokeStyle='rgba(255,46,99,.25)';ctx.lineWidth=1;ctx.setLineDash([4,6]);ctx.beginPath();ctx.moveTo(x,o.r);ctx.lineTo(x,H-o.r);ctx.stroke();ctx.restore()}
    ctx.translate(x,cy);FL=1;drawRound(o.r,o);ctx.restore();return}
  const f=o.side==='f';ctx.translate(x,f?H:0);ctx.scale(1,f?1:-1);FL=f?1:-1;
  if(o.t==='sp')drawSpikes(o.w,o);else drawBlock(o.w,o.h,o);
  ctx.restore()}

    txt(`+${m.rw}`,rx+2,ch-18,13,GOLD,'right',900);orbIcon(rx+12,ch-19,6);
    ctx.restore()});
  y+=ch+14;
  /* unlocks: next skin silhouette + secret skin */
  if(runSkins.length){const si=runSkins[runSkins.length-1],bb=1+Math.max(0,Math.sin(t*5))*.1;ctx.fillStyle='rgba(255,255,255,.07)';rrect(20,y,in_,70,18);ctx.fill();
    ctx.save();ctx.translate(70,y+35);ctx.scale(bb*1.3,bb*1.3);ctx.translate(-S/2,-S/2);drawPlayer(0,0,si,1,0,true,0);ctx.restore();txt('NEW SKIN!',cx+30,y+36,24,skinCol(si))}
  else{const half=(in_-8)/2;const nx=SKINS.find(s=>!s.ach&&s.cost>total),lock=SKINS.find(s=>s.ach&&!ach[s.ach]);
    if(nx){const pv=[...SKINS].reverse().find(s=>!s.ach&&s.cost<=total).cost;ctx.fillStyle='rgba(255,255,255,.07)';rrect(20,y,half,70,18);ctx.fill();
      ring(54,y+35,22,(total-pv)/(nx.cost-pv),GOLD,5);micon('skin',54,y+35,13);txt(`${total}`,86,y+27,16,'#fff','left',900);txt(`/${nx.cost}`,86,y+45,12,'rgba(255,255,255,.6)','left',800);orbIcon(20+half-16,y+35,8)}
    if(lock){const x=20+half+8,[ic,nn]=ACHIC[lock.ach];ctx.fillStyle='rgba(255,255,255,.07)';rrect(x,y,half,70,18);ctx.fill();
      micon('skin',x+34,y+35,13);ctx.save();ctx.translate(x+34,y+35);ctx.fillStyle=lock.c;ctx.globalAlpha=.5+.5*Math.sin(t*4);ctx.beginPath();ctx.arc(14,-14,5,0,6.283);ctx.fill();ctx.restore();
      txt('=',x+62,y+35,18,'rgba(255,255,255,.5)',null,900);micon(ic,x+92,y+35,13,nn);if(lock.ach==='score500')txt('500',x+92,y+57,11,GOLD,null,900)}}
  /* next world */
  {const yw=PH-196,nw=pendingWorld,isNew=!disc.includes(nw),wd=WORLDS[nw],pz=isNew?1+Math.sin(t*5)*.04:1;
   ctx.fillStyle='rgba(255,255,255,.07)';rrect(20,yw,in_,72,18);ctx.fill();if(isNew){ctx.strokeStyle=GOLD;ctx.lineWidth=2;ctx.stroke()}
   ctx.fillStyle=`hsl(${wd.h},${wd.s}%,${wd.l[1]+8}%)`;ctx.beginPath();ctx.arc(58,yw+36,27,0,6.283);ctx.fill();ctx.save();ctx.translate(58,yw+36);ctx.scale(pz,pz);micon('w'+nw,0,0,16);ctx.restore();
   txt('NEXT WORLD',98,yw+24,11,'rgba(255,255,255,.55)','left',900);txt(isNew?'NEW!':wd.n,98,yw+47,isNew?24:17,isNew?GOLD:'#fff','left',900,in_-160);
   for(let i=0;i<WORLDS.length;i++){const dx=20+in_-16-(WORLDS.length-1-i)*12,on=disc.includes(i);ctx.beginPath();ctx.arc(dx,yw+36,4.5,0,6.283);if(on){ctx.fillStyle='#fff';ctx.fill()}else{ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=1.5;ctx.stroke()}}}
  /* buttons */
  const shy=PH-100,bw3=(in_-10)/2;UI.share={x:px0+20*k,y:py0+shy*k,w:bw3*k,h:46*k};UI.rank={x:px0+(30+bw3)*k,y:py0+shy*k,w:bw3*k,h:46*k};
  ctx.fillStyle=shareDown?'rgba(255,138,224,.5)':'rgba(255,138,224,.22)';rrect(20,shy,bw3,46,23);ctx.fill();micon('friend',46,shy+23,11);txt('Challenge',62,shy+24,15,'#fff','left',900,bw3-50);
  ctx.fillStyle='rgba(255,210,63,.2)';rrect(30+bw3,shy,bw3,46,23);ctx.fill();micon('best',56+bw3,shy+23,11);txt('Ranking',74+bw3,shy+24,15,'#fff','left',900,bw3-60);
  if(deadT>.8){ctx.globalAlpha=a*(.6+.4*Math.sin(t*6));txt('TAP TO RETRY',cx,PH-32,22,'#fff')}
  ctx.restore()}

pendingWorld=worldIdx;hue=WORLDS[worldIdx].h;initWeather();
let last=performance.now();
function loop(now){const dt=Math.min(.033,Math.max(0,(now-last)/1000));last=now;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
}
